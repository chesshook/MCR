name: MCR mathematical-native offline tests

on:
  push:
    branches: [main, math-native-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify no pretrained model or tokenizer path remains
        run: |
          ! grep -R -n -E 'AutoModelForCausalLM|PeftModel|BitsAndBytesConfig|SmolLM3|Qwen|apply_chat_template|AutoTokenizer' --include='*.py' .
